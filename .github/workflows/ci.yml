name: Sensor CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmosquitto-dev

      - name: Build C application
        run: |
          gcc -Wall -Wextra \
            c/bme280_test.c \
            -o /tmp/bme280_test \
            -lmosquitto

      - name: Check Python syntax
        run: |
          python3 -m py_compile python/bme280_test.py

      - name: Update deploy branch
        run: |
          git push origin HEAD:refs/heads/deploy --force