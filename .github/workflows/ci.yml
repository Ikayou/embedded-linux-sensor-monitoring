name: Sensor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install C dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmosquitto-dev

      - name: Build C application
        run: |
          gcc -Wall -Wextra \
            c/bme280_test.c \
            -o /tmp/bme280_test \
            -lmosquitto

      - name: Check Python syntax
        run: |
          python3 -m py_compile python/bme280_test.py